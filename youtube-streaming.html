<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Streaming - PerthSanta Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background: #070707; min-height: 100vh; }
    body { font-family: Inter, system-ui, sans-serif; color: #fff; }

    .title-serif { font-family: "Cormorant Garamond", Georgia, serif; }
    .script-font {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.5s ease both; }
    .fade-up-d1 { animation-delay: 0.08s; }
    .fade-up-d2 { animation-delay: 0.16s; }

    .page-glow {
      pointer-events: none;
      position: fixed;
      width: 280px; height: 280px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      z-index: 0;
    }

    /* Song cards */
    .yt-card {
      background: linear-gradient(165deg, #2a0a0a 0%, #141414 45%, #0a0a0a 100%);
      border: 1px solid #3f1a1a;
      border-radius: 1rem;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .yt-card:hover {
      border-color: #991b1b;
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(185, 28, 28, 0.22);
    }

    .watch-btn {
      display: inline-block;
      background: linear-gradient(145deg, #7f1d1d 0%, #450a0a 100%);
      border: 1px solid #991b1b;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 9999px;
      padding: 0.4rem 1rem;
      transition: all 0.2s ease;
    }
    .watch-btn:hover {
      background: linear-gradient(145deg, #991b1b 0%, #7f1d1d 100%);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
    }

    .progress-track {
      height: 6px;
      background: #27272a;
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #991b1b, #ef4444);
      border-radius: 9999px;
      transition: width 0.4s ease;
    }
  </style>
</head>
<body class="text-white relative overflow-x-hidden">

  <!-- Background image mờ -->
  <div class="fixed inset-0 z-0 pointer-events-none" aria-hidden="true">
    <img src="images/poster-heartbound.jpg" alt=""
         class="w-full h-full object-cover opacity-95"
         style="filter: blur(16px) brightness(0.7) saturate(0.9); transform: scale(1.08);">
    <div class="absolute inset-0 bg-[#070707]/20"></div>
  </div>

  <!-- soft background glows -->
  <div class="page-glow bg-red-600" style="top:-80px;right:-60px;"></div>
  <div class="page-glow bg-red-800" style="bottom:10%;left:-80px;"></div>

  <!-- Header -->
  <div class="relative z-10 max-w-4xl mx-auto px-4 pt-8 pb-6">
    <div class="flex items-start justify-between gap-4">
      <div class="fade-up">
        <h1 class="title-serif text-4xl sm:text-5xl md:text-6xl font-bold leading-none tracking-tight">
          <span class="text-white">YouTube</span><br>
          <span class="text-red-500">Streaming</span>
        </h1>
        <p class="text-gray-400 text-sm mt-3">Music streaming targets on YouTube</p>
      </div>
      <div class="hidden sm:block text-right fade-up fade-up-d1 pt-2">
        <p class="script-font text-base md:text-lg text-white/70 tracking-wide font-light whitespace-nowrap">
          Together We Make It Happen
        </p>
        <div class="ml-auto mt-1.5 w-20 h-px bg-red-500/60 rounded-full"></div>
      </div>
    </div>
  </div>

  <!-- Songs list -->
  <div id="songs-list" class="relative z-10 max-w-4xl mx-auto px-4 pb-24 fade-up fade-up-d2">
    <p class="text-gray-500">Loading...</p>
  </div>

  <script src="yt-config.js"></script>
  <script src="common.js"></script>
  <script>
    function formatNumber(num) { return Number(num || 0).toLocaleString(); }

    function calculateTarget(currentViews, baseTarget) {
      var target = baseTarget;
      while (currentViews >= target) target += 100000;
      return target;
    }

    function makeCard(song, statsMap) {
      var currentViews = statsMap[song.videoId] ? statsMap[song.videoId].views : 0;
      var baseTarget = parseInt((song.target || "0").toString().replace(/,/g, "")) || 100000;
      var currentTarget = calculateTarget(currentViews, baseTarget);
      var remaining = Math.max(0, currentTarget - currentViews);
      var pct = currentTarget ? Math.min(100, Math.round(currentViews / currentTarget * 100)) : 0;

      var card = document.createElement("div");
      card.className = "yt-card";
      card.innerHTML =
        '<div class="flex gap-3 sm:gap-4 p-3.5 sm:p-4">' +
          '<img src="https://img.youtube.com/vi/' + song.videoId + '/mqdefault.jpg" alt="" class="w-28 sm:w-32 h-20 sm:h-24 object-cover rounded-lg bg-zinc-900 flex-shrink-0 border border-zinc-800">' +
          '<div class="min-w-0 flex-1 flex flex-col">' +
            '<h3 class="font-semibold text-sm sm:text-base leading-snug line-clamp-2 mb-1.5 text-zinc-100">' + song.title + '</h3>' +
            '<p class="text-[11px] sm:text-xs text-gray-400 mb-0.5">' +
              'Views <span class="text-white font-medium">' + formatNumber(currentViews) + '</span>' +
              ' · Target <span class="text-red-400 font-medium">' + formatNumber(currentTarget) + '</span>' +
            '</p>' +
            '<p class="text-[11px] sm:text-xs text-gray-400 mb-2">' +
              'Remaining <span class="text-yellow-400 font-medium">' + formatNumber(remaining) + '</span>' +
              ' · <span class="text-red-300">' + pct + '%</span>' +
            '</p>' +
            '<div class="progress-track mb-2.5"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
            '<div class="mt-auto">' +
              '<a href="https://www.youtube.com/watch?v=' + song.videoId + '" target="_blank" rel="noopener" class="watch-btn">Watch →</a>' +
            '</div>' +
          '</div>' +
        '</div>';
      return card;
    }

    fetch("data.json?t=" + Date.now())
      .then(function (res) { return res.json(); })
      .then(async function (data) {
        var songs = data.youtube || [];
        var container = document.getElementById("songs-list");
        container.innerHTML = "";

        if (!songs.length) {
          container.innerHTML = '<p class="text-gray-500">No songs added yet.</p>';
          return;
        }

        var key = window.YOUTUBE_API_KEY || "";
        var statsMap = {};
        if (key) {
          try {
            var res = await fetch(
              "https://www.googleapis.com/youtube/v3/videos?part=statistics&id=" +
              songs.map(function (s) { return s.videoId; }).join(",") +
              "&key=" + key
            );
            var json = await res.json();
            (json.items || []).forEach(function (item) {
              statsMap[item.id] = { views: parseInt(item.statistics.viewCount || 0) };
            });
          } catch (e) {}
        }

        var order = [
          { id: "trailer", label: "Trailer / Pilot" },
          { id: "ost", label: "OST" },
          { id: "perth", label: "Perth Solo" },
          { id: "jasper", label: "JASP.ER" }
        ];

        order.forEach(function (sec, idx) {
          var items = songs.filter(function (s) { return (s.group || "ost") === sec.id; });
          if (!items.length) return;

          if (idx > 0) {
            var div = document.createElement("div");
            div.className = "h-px bg-gradient-to-r from-transparent via-red-800/50 to-transparent mb-6 mt-2";
            container.appendChild(div);
          }

          var head = document.createElement("div");
          head.className = "flex items-center gap-2.5 mb-1";
          head.innerHTML =
            '<span class="w-1 h-5 bg-red-500 rounded-full"></span>' +
            '<h2 class="title-serif text-2xl sm:text-3xl font-bold text-red-500">' + sec.label + '</h2>';
          container.appendChild(head);

          var grid = document.createElement("div");
          grid.className = "grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4 mb-8 mt-4";
          items.forEach(function (s) { grid.appendChild(makeCard(s, statsMap)); });
          container.appendChild(grid);
        });
      })
      .catch(function () {
        document.getElementById("songs-list").innerHTML = '<p class="text-red-500">Error loading data.json</p>';
      });
  </script>
</body>
</html>
