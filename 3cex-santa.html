  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  button {

  }
  button:active { transform: translateY(1px); }
  #gen { background: var(--berry); color: #fff; }
  #gen:hover { background: var(--berry-dark); }
  #post { background: var(--black); color: #fff; }
  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(12px);
    background: var(--black); color: #fff; padding: 10px 14px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: .2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 640px) {
    .actions { grid-template-columns: 1fr; }

      "Le fini reste doux apres le premier passage.",
      "Le swatch vaut plus que l'intro.",
      "Le set est calme, la couleur peut se voir.",
      "C'est un rose facile a imaginer hors du live."
    ]
  }
};

const langs = Object.keys(banks);
const topics = ["praise", "collab", "product", "vibe", "future"];

function rand(n) { return Math.floor(Math.random() * n); }
function pick(arr) { return arr[rand(arr.length)]; }
function pack(body) {
  return body.replace(/\s+/g, " ").trim() + "\n\n" + KEY + "\n\n" + TAGS;
}
function loadUsed() {
  try { return new Set(JSON.parse(localStorage.getItem(LS_USED) || "[]")); }
  catch (e) { return new Set(); }
}
function saveUsed(set) {
  localStorage.setItem(LS_USED, JSON.stringify(Array.from(set).slice(-2500)));
}
function getCount() { return Number(localStorage.getItem(LS_COUNT) || "0"); }
function setCount(n) {
  localStorage.setItem(LS_COUNT, String(n));
  document.getElementById("count").textContent = "Copied: " + n + " comments";
}
function hash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0;
  return String(h);
}
function buildOne() {
  const lang = pick(langs);
  const topic = pick(topics);
  const bank = banks[lang];
  let body = pick(bank[topic]);
  const longer = Math.random() < 0.62;
  if (longer) body += " " + pick(bank.extra);
  let text = pack(body);
  if (text.length > 270) text = pack(pick(bank[topic]));
  if (text.length < 145) text = pack(pick(bank[topic]) + " " + pick(bank.extra));
  if (text.length > 270) text = pack(pick(bank[topic]));
  return text;
}
function nextComment() {
  const used = loadUsed();
  let text = "", id = "";
  for (let i = 0; i < 50; i++) {
    text = buildOne();
    id = hash(text);
    if (!used.has(id) && text.length >= 145 && text.length <= 270) break;
  }
  used.add(id);
  saveUsed(used);
  localStorage.setItem(LS_CURRENT, text);
  return text;
}
function show(text) {
  document.getElementById("out").textContent = text;
  document.getElementById("meta").textContent = text.length + " / 280";
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1400);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.left = "-9999px";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta); return ok;
  }
}
async function generateAndCopy() {
  const text = nextComment();
  show(text);
  const ok = await copyText(text);
  if (ok) { setCount(getCount() + 1); toast("Copied"); }
  else toast("Copy failed. Select the text.");
  return text;
}
function openXApp(text) {
  const msg = encodeURIComponent(text);
  const ua = navigator.userAgent || "";
  if (/Android/i.test(ua)) {
    window.location.href = "intent://post?message=" + msg + "#Intent;scheme=twitter;package=com.twitter.android;end";
    return;
  }
  if (/iPhone|iPad|iPod/i.test(ua)) {
    window.location.href = "twitter://post?message=" + msg;
    return;
  }
  const frame = document.createElement("iframe");
  frame.style.display = "none";
  frame.src = "twitter://post?message=" + msg;
  document.body.appendChild(frame);
  setTimeout(() => frame.remove(), 1200);
}
async function postX() {
  let text = localStorage.getItem(LS_CURRENT) || "";
  if (!text) text = await generateAndCopy();
  openXApp(text);
  const next = nextComment();
  show(next);
  copyText(next);
  toast("Opened X. Next line ready.");
}
document.getElementById("gen").addEventListener("click", generateAndCopy);
document.getElementById("post").addEventListener("click", postX);
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target === document.body) {
    e.preventDefault();
    generateAndCopy();
  }
});
setCount(getCount());
const saved = localStorage.getItem(LS_CURRENT);
if (saved) show(saved);
</script>
</body>
