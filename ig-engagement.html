<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Engagement - PerthSanta Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background: #070707; min-height: 100vh; }
    body { font-family: Inter, system-ui, sans-serif; color: #fff; }

    .title-serif { font-family: "Cormorant Garamond", Georgia, serif; }
    .script-font {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.5s ease both; }
    .fade-up-d1 { animation-delay: 0.08s; }
    .fade-up-d2 { animation-delay: 0.16s; }

    .page-glow {
      pointer-events: none;
      position: fixed;
      width: 280px; height: 280px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      z-index: 0;
    }

    /* IG post cards */
    .ig-card {
      position: relative;
      border-radius: 1rem;
      overflow: hidden;
      min-height: 380px;
      border: 1px solid #3f1a1a;
      transition: all 0.3s ease;
    }
    .ig-card:hover {
      border-color: #991b1b;
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(185, 28, 28, 0.22);
    }
    .ig-card img.bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ig-card .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0) 5%,
        rgba(0,0,0,0.25) 40%,
        rgba(0,0,0,0.55) 70%,
        rgba(0,0,0,0.75) 100%
      );
    }
    /* Panel kính mờ */
    .ig-card .panel {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 2;
      padding: 12px 14px 14px;
      border-radius: 0.85rem;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .ig-card::after {
      content: "";
      position: absolute;
      left: 15%; right: 15%; bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ef4444, transparent);
      opacity: 0.7;
      z-index: 3;
    }
    .ig-card:hover::after { opacity: 1; }

    .stat-box {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.65rem;
      padding: 0.45rem 0.2rem;
    }

    /* Generator — vuông to kiểu EP */
    .gen-btn {
      width: 3.25rem;
      height: 3.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #2a0a0a 0%, #18181b 50%, #0c0c0c 100%);
      border: 1px solid #3f3f46;
      border-radius: 0.75rem;
      text-align: center;
      padding: 0.2rem;
      transition: all 0.25s ease;
      font-size: 0.65rem;
      font-weight: 600;
      color: #d4d4d8;
      line-height: 1.15;
    }
    @media (min-width: 640px) {
      .gen-btn { width: 3.75rem; height: 3.75rem; font-size: 0.72rem; }
    }
    .gen-btn:hover {
      border-color: #ef4444;
      color: #fff;
      background: linear-gradient(145deg, #450a0a 0%, #1c0909 50%, #0c0c0c 100%);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.3);
      transform: translateY(-2px);
    }

    .ig-open-btn {
      display: block;
      text-align: center;
      background: linear-gradient(145deg, #7f1d1d 0%, #450a0a 100%);
      border: 1px solid #991b1b;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 9999px;
      padding: 0.55rem 1rem;
      transition: all 0.2s ease;
    }
    .ig-open-btn:hover {
      background: linear-gradient(145deg, #991b1b 0%, #7f1d1d 100%);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.35);
    }
  </style>
</head>
<body class="text-white relative overflow-x-hidden">

  <!-- Background image mờ -->
  <div class="fixed inset-0 z-0 pointer-events-none" aria-hidden="true">
    <img src="images/poster-heartbound.jpg" alt=""
         class="w-full h-full object-cover opacity-95"
         style="filter: blur(16px) brightness(0.7) saturate(0.9); transform: scale(1.08);">
    <div class="absolute inset-0 bg-[#070707]/20"></div>
  </div>

  <!-- soft background glows -->
  <div class="page-glow bg-red-600" style="top:-80px;right:-60px;"></div>
  <div class="page-glow bg-red-800" style="bottom:10%;left:-80px;"></div>

  <!-- Header -->
  <div class="relative z-10 max-w-4xl mx-auto px-4 pt-8 pb-6">
    <div class="flex items-start justify-between gap-4">
      <div class="fade-up">
        <h1 class="title-serif text-4xl sm:text-5xl md:text-6xl font-bold leading-none tracking-tight">
          <span class="text-white">Instagram</span><br>
          <span class="text-red-500">Engagement</span>
        </h1>
        <p class="text-gray-400 text-sm mt-3">Likes, comments & community</p>
      </div>
      <div class="hidden sm:block text-right fade-up fade-up-d1 pt-2">
        <p class="script-font text-base md:text-lg text-white/70 tracking-wide font-light whitespace-nowrap">
          Together We Make It Happen
        </p>
        <div class="ml-auto mt-1.5 w-20 h-px bg-red-500/60 rounded-full"></div>
      </div>
    </div>
  </div>

  <!-- Posts grid -->
  <div id="ig-list" class="relative z-10 max-w-4xl mx-auto px-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pb-24 fade-up fade-up-d2"></div>

  <script src="common.js"></script>
  <script>
    function formatNum(n) { return (Number(n) || 0).toLocaleString("en-US"); }

    function fallbackThumb(handle) {
      var label = (handle || "@IG").replace("@", "");
      return "data:image/svg+xml;utf8," + encodeURIComponent(
        "<svg xmlns='http://www.w3.org/2000/svg' width='640' height='800'><rect width='100%' height='100%' fill='#7f1d1d'/><text x='320' y='400' text-anchor='middle' font-size='28' fill='#fecaca' font-family='sans-serif'>@" + label + "</text></svg>"
      );
    }

    fetch("data.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var list = document.getElementById("ig-list");
        var posts = (data.instagram || []).slice();
        posts.sort(function (a, b) {
          return String(b.date || "").localeCompare(String(a.date || ""));
        });
        list.innerHTML = "";

        if (!posts.length) {
          list.innerHTML = '<p class="text-gray-500 col-span-full">No posts yet.</p>';
          return;
        }

        posts.forEach(function (post) {
          var gens = "";
          (post.generators || []).forEach(function (g, i) {
            var label = (g.name || ("Gen " + (i + 1))).replace("Generator ", "Gen ");
            gens += '<a href="' + (g.url || "#") + '" target="_blank" rel="noopener" class="gen-btn"><span>' + label + "</span></a>";
          });

          var card = document.createElement("article");
          card.className = "ig-card";
          card.innerHTML =
            '<img class="bg" alt="">' +
            '<div class="shade"></div>' +
            '<div class="panel">' +
              '<p class="text-red-300 text-xs font-medium meta"></p>' +
              '<h3 class="font-bold text-sm sm:text-[15px] mt-0.5 mb-2.5 leading-snug text-white"></h3>' +
              '<div class="grid grid-cols-3 gap-1.5 text-center mb-2.5">' +
                '<div class="stat-box"><p class="text-[9px] text-gray-400 uppercase tracking-wider">Like</p><p class="font-semibold text-red-400 text-xs mt-0.5">' + formatNum(post.like) + "</p></div>" +
                '<div class="stat-box"><p class="text-[9px] text-gray-400 uppercase tracking-wider">Comment</p><p class="font-semibold text-red-400 text-xs mt-0.5">' + formatNum(post.comment) + "</p></div>" +
                '<div class="stat-box"><p class="text-[9px] text-gray-400 uppercase tracking-wider">Share</p><p class="font-semibold text-red-400 text-xs mt-0.5">' + formatNum(post.share) + "</p></div>" +
              "</div>" +
              (gens ? '<div class="flex flex-wrap gap-2 mb-2.5">' + gens + "</div>" : "") +
              '<a href="' + (post.postUrl || "#") + '" target="_blank" rel="noopener" class="ig-open-btn">Open Instagram →</a>' +
            "</div>";

          card.querySelector(".meta").textContent = (post.handle || "") + (post.date ? " · " + post.date : "");
          card.querySelector("h3").textContent = post.title || "Instagram post";
          var img = card.querySelector("img");
          img.src = post.image || fallbackThumb(post.handle);
          img.onerror = function () { img.src = fallbackThumb(post.handle); };
          list.appendChild(card);
        });
      })
      .catch(function () {
        document.getElementById("ig-list").innerHTML = '<p class="text-red-500 col-span-full">Failed to load data.json</p>';
      });
  </script>
</body>
</html>
