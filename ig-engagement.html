<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Engagement - PerthSanta Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background: #070707; min-height: 100vh; }
    body { font-family: Inter, system-ui, sans-serif; color: #fff; }
    .title-serif { font-family: "Cormorant Garamond", Georgia, serif; }
    .script-font { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 500; letter-spacing: 0.04em; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.5s ease both; }
    .fade-up-d1 { animation-delay: 0.08s; }
    .fade-up-d2 { animation-delay: 0.16s; }
    .page-glow { pointer-events: none; position: fixed; width: 280px; height: 280px; border-radius: 50%; filter: blur(80px); opacity: 0.12; z-index: 0; }

    .ig-card {
      position: relative;
      border-radius: 1rem;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      border: 1px solid #3f1a1a;
      transition: all 0.3s ease;
    }
    .ig-card:hover { border-color: #991b1b; transform: translateY(-4px); box-shadow: 0 12px 28px rgba(185, 28, 28, 0.22); }
    .ig-card img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ig-card .shade {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 42%, rgba(0,0,0,0.35) 68%, rgba(0,0,0,0.82) 100%);
    }
    .ig-card .panel {
      position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 2;
      padding: 10px 10px 10px;
      border-radius: 0.85rem;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .ig-card::after {
      content: ""; position: absolute; left: 15%; right: 15%; bottom: 0; height: 2px;
      background: linear-gradient(90deg, transparent, #ef4444, transparent); opacity: 0.7; z-index: 3;
    }

    .stat-box {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 0.55rem;
      padding: 0.4rem 0.2rem;
    }
    .stat-label { color: #e5e5e5; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
    .stat-num { color: #fff; font-size: 13px; font-weight: 700; }
    @keyframes statBlink { 0%, 100% { opacity: 1; color: #f87171; } 50% { opacity: 0.35; color: #fecaca; } }
    .stat-box.pending .stat-num { animation: statBlink 1.1s ease-in-out infinite; }
    .stat-box.done .stat-num { color: #4ade80; animation: none; }

    .action-row { display: flex; align-items: stretch; gap: 8px; }
    .gen-btn {
      flex: 0 0 42%;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      border: 1px solid #f87171;
      background: linear-gradient(145deg, #3f0d0d 0%, #1a1a1a 70%);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.35), inset 0 1px 0 rgba(255,255,255,0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .gen-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.55);
    }
    .ig-open-btn {
      flex: 1;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      border: 1px solid #991b1b;
      background: linear-gradient(145deg, #991b1b 0%, #450a0a 100%);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .ig-open-btn:hover { background: linear-gradient(145deg, #b91c1c 0%, #7f1d1d 100%); }
  </style>
</head>
<body class="text-white relative overflow-x-hidden">
  <div class="fixed inset-0 z-0 pointer-events-none" aria-hidden="true">
    <img src="images/poster-heartbound.jpg" alt="" class="w-full h-full object-cover opacity-95" style="filter: blur(16px) brightness(0.7) saturate(0.9); transform: scale(1.08);">
    <div class="absolute inset-0 bg-[#070707]/20"></div>
  </div>
  <div class="page-glow bg-red-600" style="top:-80px;right:-60px;"></div>
  <div class="page-glow bg-red-800" style="bottom:10%;left:-80px;"></div>

  <div class="relative z-10 max-w-4xl mx-auto px-4 pt-8 pb-6">
    <div class="flex items-start justify-between gap-4">
      <div class="fade-up">
        <h1 class="title-serif text-4xl sm:text-5xl md:text-6xl font-bold leading-none tracking-tight">
          <span class="text-white">Instagram</span><br>
          <span class="text-red-500">Engagement</span>
        </h1>
        <p class="text-gray-400 text-sm mt-3">Likes, comments & community</p>
      </div>
      <div class="hidden sm:block text-right fade-up fade-up-d1 pt-2">
        <p class="script-font text-base md:text-lg text-white/70 tracking-wide font-light whitespace-nowrap">Together We Make It Happen</p>
        <div class="ml-auto mt-1.5 w-20 h-px bg-red-500/60 rounded-full"></div>
      </div>
    </div>
  </div>

  <div id="ig-list" class="relative z-10 max-w-4xl mx-auto px-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pb-24 fade-up fade-up-d2"></div>

  <script src="common.js"></script>
  <script>
    function formatNum(n) { return (Number(n) || 0).toLocaleString("en-US"); }
    function fallbackThumb(handle) {
      var label = (handle || "@IG").replace("@", "");
      return "data:image/svg+xml;utf8," + encodeURIComponent(
        "<svg xmlns='http://www.w3.org/2000/svg' width='640' height='800'><rect width='100%' height='100%' fill='#7f1d1d'/><text x='320' y='400' text-anchor='middle' font-size='28' fill='#fecaca' font-family='sans-serif'>@" + label + "</text></svg>"
      );
    }
    function statBox(label, value, done) {
      return '<div class="stat-box ' + (done ? "done" : "pending") + '">' +
        '<p class="stat-label">' + label + "</p>" +
        '<p class="stat-num mt-0.5">' + formatNum(value) + "</p></div>";
    }
    fetch("data.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var list = document.getElementById("ig-list");
        var posts = (data.instagram || []).slice();
        posts.sort(function (a, b) { return String(b.date || "").localeCompare(String(a.date || "")); });
        list.innerHTML = "";
        if (!posts.length) {
          list.innerHTML = '<p class="text-gray-500 col-span-full">No posts yet.</p>';
          return;
        }
        posts.forEach(function (post) {
          var gens = "";
          (post.generators || []).forEach(function (g, i) {
            var label = (g.name || ("Gen " + (i + 1))).replace("Generator ", "Gen ");
            gens += '<a href="' + (g.url || "#") + '" target="_blank" rel="noopener" class="gen-btn"><span>' + label + "</span></a>";
          });
          var card = document.createElement("article");
          card.className = "ig-card";
          card.innerHTML =
            '<img class="bg" alt="">' +
            '<div class="shade"></div>' +
            '<div class="panel">' +
              '<p class="text-red-300 text-xs font-medium meta truncate"></p>' +
              '<h3 class="font-bold text-sm mt-0.5 mb-2 leading-snug text-white line-clamp-1"></h3>' +
              '<div class="grid grid-cols-3 gap-1.5 text-center mb-2">' +
                statBox("Like", post.like, post.likeDone === true) +
                statBox("Comment", post.comment, post.commentDone === true) +
                statBox("Share", post.share, post.shareDone === true) +
              "</div>" +
              '<div class="action-row">' +
                gens +
                '<a href="' + (post.postUrl || "#") + '" target="_blank" rel="noopener" class="ig-open-btn">Open IG</a>' +
              "</div>" +
            "</div>";
          card.querySelector(".meta").textContent = (post.handle || "") + (post.date ? " · " + post.date : "");
          card.querySelector("h3").textContent = post.title || "Instagram post";
          var img = card.querySelector("img");
          img.src = post.image || fallbackThumb(post.handle);
          img.onerror = function () { img.src = fallbackThumb(post.handle); };
          list.appendChild(card);
        });
      })
      .catch(function () {
        document.getElementById("ig-list").innerHTML = '<p class="text-red-500 col-span-full">Failed to load data.json</p>';
      });
  </script>
</body>
</html>
