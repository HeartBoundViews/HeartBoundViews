<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Introduce - PerthSanta Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #070707; min-height: 100vh; }
    .card { transition: all 0.25s ease; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(185, 28, 28, 0.2); }
  </style>
</head>
<body class="text-white">
  <div class="max-w-5xl mx-auto px-4 pt-8 pb-6">
    <h1 class="text-3xl md:text-4xl font-bold mb-2">Introduce</h1>
  </div>

  <div id="intro-home">
    <section class="max-w-5xl mx-auto px-4 mb-10">
      <h2 class="text-xl font-bold mb-4">Profile</h2>
      <div id="profile-list" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
    </section>

    <section class="max-w-5xl mx-auto px-4 pb-20">
      <h2 class="text-xl font-bold mb-4">Job Information</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <button type="button" onclick="showSchedule()"
          class="card bg-zinc-900 border border-zinc-700 rounded-2xl p-5 text-left">
          <h3 class="text-lg font-bold">Schedule</h3>
        </button>

        <a id="inf-job-link" href="#" target="_blank" rel="noopener"
          class="card bg-zinc-900 border border-zinc-700 rounded-2xl p-5 block">
          <h3 class="text-lg font-bold">Summary</h3>
        </a>
      </div>
    </section>
  </div>

  <div id="intro-detail" class="hidden max-w-md mx-auto px-4 pb-20">
    <div class="flex items-center justify-between mb-4">
      <h2 id="detail-name" class="text-xl font-bold">Profile</h2>
      <button type="button" onclick="backToHome()" class="text-sm text-red-500 hover:text-red-400">← Back</button>
    </div>
    <div id="detail-box" class="bg-zinc-900 border border-zinc-700 rounded-2xl p-5"></div>
  </div>

  <div id="intro-schedule" class="hidden max-w-5xl mx-auto px-4 pb-20">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold">Schedule</h2>
      <button type="button" onclick="backToHome()" class="text-sm text-red-500 hover:text-red-400">← Back</button>
    </div>
    <div id="schedule-box"></div>
  </div>

  <script src="common.js"></script>
  <script>
    let introData = { profiles: [], schedule: [], infJobUrl: "#" };

    fetch("data.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (json) {
        introData = json.introduce || introData;
        renderProfiles();
        document.getElementById("inf-job-link").href = introData.infJobUrl || "#";
      })
      .catch(function () {
        document.getElementById("profile-list").innerHTML =
          "<p class='text-red-500'>Error loading data.json</p>";
      });

    function socialIcon(name) {
      var n = (name || "").toLowerCase();
      if (n === "x" || n === "twitter") {
        return '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';
      }
      if (n === "ig" || n === "instagram") {
        return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg>';
      }
      if (n === "tiktok") {
        return '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15.2a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.73a8.19 8.19 0 0 0 4.76 1.52V6.84a4.84 4.84 0 0 1-1-.15z"/></svg>';
      }
      return "";
    }

    function socialStyle(name) {
      var n = (name || "").toLowerCase();
      if (n === "x" || n === "twitter") {
        return "background:#000;color:#fff;border:1px solid #333;";
      }
      if (n === "ig" || n === "instagram") {
        return "background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;";
      }
      if (n === "tiktok") {
        return "background:#010101;color:#fff;border:1px solid #25F4EE;";
      }
      return "background:#b91c1c;color:#fff;";
    }

    function socialLinks(p) {
      return (p.socials || []).filter(function (s) { return s.url; }).map(function (s) {
        return '<a href="' + s.url + '" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-xs rounded-full px-3 py-1.5 font-medium" style="' + socialStyle(s.name) + '">' +
          socialIcon(s.name) +
          '<span>' + s.name + "</span>" +
        "</a>";
      }).join("") || '<span class="text-xs text-gray-500">No links yet</span>';
    }

    function hideAll() {
      document.getElementById("intro-home").classList.add("hidden");
      document.getElementById("intro-detail").classList.add("hidden");
      document.getElementById("intro-schedule").classList.add("hidden");
    }

    function renderProfiles() {
      const box = document.getElementById("profile-list");
      box.innerHTML = "";
      (introData.profiles || []).forEach(function (p, i) {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "card bg-zinc-900 border border-zinc-700 rounded-2xl overflow-hidden text-left";
        el.onclick = function () { showProfile(i); };
        el.innerHTML =
          '<div class="p-4">' +
            '<img src="' + (p.photo || "") + '" alt="' + (p.name || "") + '" class="w-full aspect-square object-cover rounded-xl bg-zinc-800">' +
          '</div>' +
          '<div class="px-4 pb-4">' +
            '<h3 class="text-lg font-bold">' + (p.name || "") + "</h3>" +
            '<p class="text-sm text-gray-400 truncate">' + (p.fullname || "") + "</p>" +
          "</div>";
        box.appendChild(el);
      });
    }

    function showProfile(i) {
      const p = (introData.profiles || [])[i];
      if (!p) return;
      hideAll();
      document.getElementById("intro-detail").classList.remove("hidden");
      document.getElementById("detail-name").innerText = p.name || "Profile";
      /* Label: text-sm (to hơn text-xs cũ), nội dung: text-base font-medium (vẫn lớn hơn label) */
      document.getElementById("detail-box").innerHTML =
        '<div class="p-1 mb-4">' +
          '<img src="' + (p.photo || "") + '" alt="" class="w-full aspect-square object-cover rounded-xl bg-zinc-800">' +
        '</div>' +
        '<p class="text-sm text-gray-400 mb-1">Full name</p>' +
        '<p class="text-base font-medium mb-3">' + (p.fullname || p.name || "—") + "</p>" +
        '<p class="text-sm text-gray-400 mb-1">Thai name</p>' +
        '<p class="text-base font-medium mb-3">' + (p.thaiName || "—") + "</p>" +
        '<p class="text-sm text-gray-400 mb-1">Role</p>' +
        '<p class="text-base font-medium mb-3">' + (p.role || "—") + "</p>" +
        '<p class="text-sm text-gray-400 mb-1">Birthday</p>' +
        '<p class="text-base font-medium mb-3">' + (p.born || "—") + "</p>" +
        '<p class="text-sm text-gray-400 mb-1">Agency</p>' +
        '<p class="text-base font-medium mb-4">' + (p.agency || "—") + "</p>" +
        '<p class="text-sm text-gray-400 mb-2">Socials</p>' +
        '<div class="flex flex-wrap gap-2">' + socialLinks(p) + "</div>";
    }

    function showSchedule() {
      hideAll();
      document.getElementById("intro-schedule").classList.remove("hidden");
      const box = document.getElementById("schedule-box");
      box.innerHTML = "";
      (introData.schedule || []).forEach(function (m) {
        const items = (m.items || []).map(function (it) {
          var extra = "";
          var tag = it.hastag || it.hashtag || "";
          if (tag) {
            extra += '<p class="text-sm text-gray-400 mt-1"><span class="text-zinc-500">Hashtag:</span> #' + tag + "</p>";
          }
          if (it.keyword) {
            extra += '<p class="text-sm text-gray-400 mt-1"><span class="text-zinc-500">Keyword:</span> ' + it.keyword + "</p>";
          }
          if (it.location) {
            extra += '<p class="text-sm text-gray-400 mt-1"><span class="text-zinc-500">Location:</span> ' + it.location + "</p>";
          }
          return '<div class="flex gap-4 py-3 border-b border-zinc-800 last:border-0">' +
            '<p class="w-24 text-red-400 text-sm shrink-0">' + (it.date || "") + "</p>" +
            "<div>" +
              '<p class="font-medium">' + (it.title || "") + "</p>" +
              '<p class="text-sm text-gray-400">' + (it.note || "") + "</p>" +
              extra +
            "</div></div>";
        }).join("");
        const el = document.createElement("div");
        el.className = "bg-zinc-900 border border-zinc-700 rounded-2xl p-5 mb-4";
        el.innerHTML = "<h3 class=\"text-lg font-bold mb-3\">" + (m.month || "") + "</h3>" + items;
        box.appendChild(el);
      });
    }

    function backToHome() {
      hideAll();
      document.getElementById("intro-home").classList.remove("hidden");
    }
  </script>
</body>
</html>
