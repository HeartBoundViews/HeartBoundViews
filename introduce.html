<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Introduce - PerthSanta Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #070707; min-height: 100vh; }
    .card { transition: all 0.25s ease; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(185, 28, 28, 0.2); }
    .profile-photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      object-position: center;
      background: #18181b;
    }
    .profile-photo-lg {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      object-position: center;
      background: #18181b;
    }
  </style>
</head>
<body class="text-white">
  <div class="max-w-5xl mx-auto px-4 pt-8 pb-6">
    <h1 class="text-4xl md:text-5xl font-bold mb-2">Introduce</h1>
  </div>

  <div id="intro-home">
    <section class="max-w-5xl mx-auto px-4 mb-10">
      <h2 class="text-2xl font-bold mb-4">Profile</h2>
      <div id="profile-list" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
    </section>

    <section class="max-w-5xl mx-auto px-4 pb-20">
      <h2 class="text-2xl font-bold mb-4">Job Information</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <button type="button" onclick="showSchedule()"
          class="card bg-zinc-900 border border-zinc-700 rounded-2xl p-6 text-left">
          <h3 class="text-xl font-bold">Schedule</h3>
        </button>

        <a id="inf-job-link" href="#" target="_blank" rel="noopener"
          class="card bg-zinc-900 border border-zinc-700 rounded-2xl p-6 block">
          <h3 class="text-xl font-bold">Summary</h3>
        </a>
      </div>
    </section>
  </div>

  <div id="intro-detail" class="hidden max-w-xl mx-auto px-4 pb-20">
    <div class="flex items-center justify-between mb-4">
      <h2 id="detail-name" class="text-2xl md:text-3xl font-bold">Profile</h2>
      <div class="flex items-center gap-4">
        <button type="button" onclick="prevProfile()" class="text-base text-red-500 hover:text-red-400">← Back</button>
        <button type="button" id="next-btn" onclick="nextProfile()" class="text-base text-red-500 hover:text-red-400">Next →</button>
      </div>
    </div>
    <div id="detail-box" class="bg-zinc-900 border border-zinc-700 rounded-2xl p-5 sm:p-7"></div>
  </div>

  <div id="intro-schedule" class="hidden max-w-5xl mx-auto px-4 pb-20">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl md:text-3xl font-bold">Schedule</h2>
      <button type="button" onclick="backToHome()" class="text-base text-red-500 hover:text-red-400">← Back</button>
    </div>
    <div id="schedule-box"></div>
  </div>

  <script src="common.js"></script>
  <script>
    let introData = { profiles: [], schedule: [], infJobUrl: "#" };
    let currentIndex = 0;

    fetch("data.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (json) {
        introData = json.introduce || introData;
        renderProfiles();
        document.getElementById("inf-job-link").href =
          introData.infJobUrl || introData["information job"] || "#";
      })
      .catch(function () {
        document.getElementById("profile-list").innerHTML =
          "<p class='text-red-500'>Error loading data.json</p>";
      });

    function socialLinks(p) {
      const icons = {
        X: {
          svg: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2H21.5l-7.5 8.57L22.5 22h-6.56l-5.14-6.72L5.2 22H1.94l8.02-9.16L1.5 2h6.73l4.65 6.17L18.244 2zm-1.15 18.12h1.82L7 3.78H5.05l12.04 16.34z"/></svg>',
          cls: "bg-black hover:bg-zinc-800 text-white"
        },
        IG: {
          svg: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
          cls: "text-white"
        },
        Instagram: {
          svg: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
          cls: "text-white"
        },
        TikTok: {
          svg: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 3c.2 2.6 1.6 4.4 4.2 4.7v2.6c-1.4 0-2.7-.4-4.1-1.3v6.7c0 3.4-2.6 6.1-6.1 6.1S2.4 19.1 2.4 15.6 5 9.5 8.5 9.5c.4 0 .8 0 1.1.1v2.8c-.3-.1-.7-.2-1.1-.2-2 0-3.6 1.6-3.6 3.6s1.6 3.6 3.6 3.6 3.6-1.6 3.6-3.6V3h2.4z"/></svg>',
          cls: "bg-black hover:bg-zinc-800 text-white"
        }
      };

      return (p.socials || []).filter(function (s) { return s.url; }).map(function (s) {
        var item = icons[s.name] || { svg: s.name, cls: "bg-zinc-700 text-white" };
        var extra = "";
        if (s.name === "IG" || s.name === "Instagram") {
          extra = ' style="background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4)"';
        } else if (s.name === "TikTok") {
          extra = ' style="box-shadow: 2px 0 0 #25F4EE, -2px 0 0 #FE2C55"';
        }
        return '<a href="' + s.url + '" target="_blank" rel="noopener" title="' + s.name + '" class="inline-flex items-center justify-center w-11 h-11 rounded-full ' + item.cls + '"' + extra + ">" + item.svg + "</a>";
      }).join("") || '<span class="text-sm text-gray-500">No links yet</span>';
    }

    function hideAll() {
      document.getElementById("intro-home").classList.add("hidden");
      document.getElementById("intro-detail").classList.add("hidden");
      document.getElementById("intro-schedule").classList.add("hidden");
    }

    function renderProfiles() {
      const box = document.getElementById("profile-list");
      box.innerHTML = "";
      (introData.profiles || []).forEach(function (p, i) {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "card bg-zinc-900 border border-zinc-700 rounded-2xl overflow-hidden text-left";
        el.onclick = function () { showProfile(i); };
        el.innerHTML =
          '<img src="' + (p.photo || "") + '" alt="' + (p.name || "") + '" class="profile-photo">' +
          '<div class="p-4">' +
            '<h3 class="text-xl font-bold">' + (p.name || "") + "</h3>" +
            '<p class="text-base text-gray-400 truncate">' + (p.fullname || "") + "</p>" +
          "</div>";
        box.appendChild(el);
      });
    }

    function showProfile(i) {
      const list = introData.profiles || [];
      if (!list[i]) return;
      currentIndex = i;
      const p = list[i];
      hideAll();
      document.getElementById("intro-detail").classList.remove("hidden");
      document.getElementById("detail-name").innerText = p.name || "Profile";
      document.getElementById("next-btn").classList.toggle("hidden", i >= list.length - 1);
      document.getElementById("detail-box").innerHTML =
        '<img src="' + (p.photo || "") + '" alt="" class="profile-photo-lg rounded-2xl mb-5 mx-auto">' +
        '<p class="text-sm text-gray-500 mb-1">Full name</p>' +
        '<p class="text-lg font-medium mb-4">' + (p.fullname || p.name || "—") + "</p>" +
        '<p class="text-sm text-gray-500 mb-1">Thai name</p>' +
        '<p class="text-lg font-medium mb-4">' + (p.thaiName || "—") + "</p>" +
        '<p class="text-sm text-gray-500 mb-1">Role</p>' +
        '<p class="text-lg font-medium mb-4">' + (p.role || "—") + "</p>" +
        '<p class="text-sm text-gray-500 mb-1">Birthday</p>' +
        '<p class="text-lg font-medium mb-4">' + (p.born || "—") + "</p>" +
        '<p class="text-sm text-gray-500 mb-1">Agency</p>' +
        '<p class="text-lg font-medium mb-5">' + (p.agency || "—") + "</p>" +
        '<p class="text-sm text-gray-500 mb-2">Socials</p>' +
        '<div class="flex flex-wrap gap-3">' + socialLinks(p) + "</div>";
    }

    function prevProfile() {
      if (currentIndex > 0) showProfile(currentIndex - 1);
      else backToHome();
    }

    function nextProfile() {
      if (currentIndex < (introData.profiles || []).length - 1) {
        showProfile(currentIndex + 1);
      }
    }

    function showSchedule() {
      hideAll();
      document.getElementById("intro-schedule").classList.remove("hidden");
      const box = document.getElementById("schedule-box");
      box.innerHTML = "";
      (introData.schedule || []).forEach(function (m) {
        const items = (m.items || []).map(function (it) {
          return '<div class="flex gap-4 py-3 border-b border-zinc-800 last:border-0">' +
            '<p class="w-28 text-red-400 text-base shrink-0">' + (it.date || "") + "</p>" +
            "<div><p class=\"text-lg font-medium\">" + (it.title || "") + "</p>" +
            '<p class="text-base text-gray-400">' + (it.note || "") + "</p></div></div>";
        }).join("");
        const el = document.createElement("div");
        el.className = "bg-zinc-900 border border-zinc-700 rounded-2xl p-5 mb-4";
        el.innerHTML = "<h3 class=\"text-xl font-bold mb-3\">" + (m.month || "") + "</h3>" + items;
        box.appendChild(el);
      });
    }

    function backToHome() {
      hideAll();
      document.getElementById("intro-home").classList.remove("hidden");
    }
  </script>
</body>
</html>
