<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Introduce - PerthSanta Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background: #070707; min-height: 100vh; }
    body { font-family: Inter, system-ui, sans-serif; color: #fff; }

    .title-serif { font-family: "Cormorant Garamond", Georgia, serif; }
    .script-font {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.5s ease both; }
    .fade-up-d1 { animation-delay: 0.08s; }
    .fade-up-d2 { animation-delay: 0.16s; }
    .fade-up-d3 { animation-delay: 0.24s; }

    .page-glow {
      pointer-events: none;
      position: fixed;
      width: 280px; height: 280px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      z-index: 0;
    }

    .profile-card {
      background: linear-gradient(165deg, #2a0a0a 0%, #141414 45%, #0a0a0a 100%);
      border: 1px solid #3f1a1a;
      border-radius: 1rem;
      overflow: hidden;
      text-align: left;
      transition: all 0.3s ease;
      width: 100%;
    }
    .profile-card:hover {
      border-color: #991b1b;
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(185, 28, 28, 0.22);
    }
    .photo-frame {
      background: #0a0a0a;
      padding: 10px;
    }
    .photo-frame img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center top;
      display: block;
      border-radius: 0.65rem;
      background: #000;
    }
    .photo-frame-lg img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 1rem;
      border: 1px solid #3f1a1a;
    }

    .action-card {
      display: block;
      background: linear-gradient(165deg, #2a0a0a 0%, #141414 45%, #0a0a0a 100%);
      border: 1px solid #3f1a1a;
      border-radius: 1rem;
      padding: 1.5rem 1.25rem;
      text-align: left;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      width: 100%;
    }
    .action-card::after {
      content: "";
      position: absolute; left: 20%; right: 20%; bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ef4444, transparent);
      opacity: 0.7;
    }
    .action-card:hover {
      border-color: #991b1b;
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(185, 28, 28, 0.22);
      background: linear-gradient(165deg, #450a0a 0%, #1a0a0a 45%, #0a0a0a 100%);
    }
    .action-card:hover::after { opacity: 1; }

    .panel-box {
      background: linear-gradient(165deg, #2a0a0a 0%, #141414 45%, #0a0a0a 100%);
      border: 1px solid #3f1a1a;
      border-radius: 1rem;
      padding: 1.25rem 1.25rem 1.5rem;
    }

    .back-link {
      color: #f87171;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: #fca5a5; }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.75rem;
      background: linear-gradient(145deg, #7f1d1d 0%, #450a0a 100%);
      border: 1px solid #991b1b;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 9999px;
      padding: 0.4rem 0.9rem;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .copy-btn:hover {
      background: linear-gradient(145deg, #991b1b 0%, #7f1d1d 100%);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
    }
    .copy-btn.copied {
      background: linear-gradient(145deg, #166534 0%, #14532d 100%);
      border-color: #22c55e;
    }
  </style>
</head>
<body class="text-white relative overflow-x-hidden">

  <!-- Background image mờ -->
  <div class="fixed inset-0 z-0 pointer-events-none" aria-hidden="true">
    <img src="images/poster-heartbound.jpg" alt=""
         class="w-full h-full object-cover opacity-95"
         style="filter: blur(16px) brightness(0.7) saturate(0.9); transform: scale(1.08);">
    <div class="absolute inset-0 bg-[#070707]/20"></div>
  </div>

  <!-- soft background glows -->
  <div class="page-glow bg-red-600" style="top:-80px;right:-60px;"></div>
  <div class="page-glow bg-red-800" style="bottom:10%;left:-80px;"></div>

  <!-- Header -->
  <div class="relative z-10 max-w-4xl mx-auto px-4 pt-8 pb-6">
    <div class="flex items-start justify-between gap-4">
      <div class="fade-up">
        <h1 class="title-serif text-4xl sm:text-5xl md:text-6xl font-bold leading-none tracking-tight">
          <span class="text-white">Intro</span><span class="text-red-500">duce</span>
        </h1>
        <p class="text-gray-400 text-sm mt-3">Profiles · Schedule · Info</p>
      </div>
      <div class="hidden sm:block text-right fade-up fade-up-d1 pt-2">
        <p class="script-font text-base md:text-lg text-white/70 tracking-wide font-light whitespace-nowrap">
          Together We Make It Happen
        </p>
        <div class="ml-auto mt-1.5 w-20 h-px bg-red-500/60 rounded-full"></div>
      </div>
    </div>
  </div>

  <!-- HOME -->
  <div id="intro-home" class="relative z-10">
    <section class="max-w-4xl mx-auto px-4 mb-10 fade-up fade-up-d1">
      <div class="flex items-center gap-2.5 mb-1">
        <span class="w-1 h-5 bg-red-500 rounded-full"></span>
        <h2 class="title-serif text-2xl sm:text-3xl font-bold text-red-500">Profile</h2>
      </div>
      <p class="text-gray-400 text-sm mb-5 ml-3.5">Tap a card to view full profile.</p>
      <div id="profile-list" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
    </section>

    <div class="max-w-4xl mx-auto px-4 mb-8">
      <div class="h-px bg-gradient-to-r from-transparent via-red-800/50 to-transparent"></div>
    </div>

    <section class="max-w-4xl mx-auto px-4 pb-24 fade-up fade-up-d2">
      <div class="flex items-center gap-2.5 mb-1">
        <span class="w-1 h-5 bg-red-500 rounded-full"></span>
        <h2 class="title-serif text-2xl sm:text-3xl font-bold text-red-500">Job Information</h2>
      </div>
      <p class="text-gray-400 text-sm mb-5 ml-3.5">Schedule & summary.</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <button type="button" onclick="showSchedule()" class="action-card">
          <h3 class="text-lg sm:text-xl font-bold text-zinc-100">Schedule</h3>
          <p class="text-sm text-gray-400 mt-1">Upcoming events →</p>
        </button>
        <a id="inf-job-link" href="#" target="_blank" rel="noopener" class="action-card">
          <h3 class="text-lg sm:text-xl font-bold text-zinc-100">Summary</h3>
          <p class="text-sm text-gray-400 mt-1">Open full info →</p>
        </a>
      </div>
    </section>
  </div>

  <!-- PROFILE DETAIL -->
  <div id="intro-detail" class="hidden relative z-10 max-w-xl mx-auto px-4 pb-24">
    <div class="flex items-center justify-between mb-5">
      <h2 id="detail-name" class="title-serif text-2xl sm:text-3xl font-bold text-red-500">Profile</h2>
      <div class="flex items-center gap-4">
        <button type="button" onclick="prevProfile()" class="back-link">← Back</button>
        <button type="button" id="next-btn" onclick="nextProfile()" class="back-link">Next →</button>
      </div>
    </div>
    <div id="detail-box" class="panel-box"></div>
  </div>

  <!-- SCHEDULE -->
  <div id="intro-schedule" class="hidden relative z-10 max-w-4xl mx-auto px-4 pb-24">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-2.5">
        <span class="w-1 h-5 bg-red-500 rounded-full"></span>
        <h2 class="title-serif text-2xl sm:text-3xl font-bold text-red-500">Schedule</h2>
      </div>
      <button type="button" onclick="backToHome()" class="back-link">← Back</button>
    </div>
    <div id="schedule-box"></div>
  </div>

  <script src="common.js"></script>
  <script>
    var introData = { profiles: [], schedule: [], infJobUrl: "#" };
    var currentIndex = 0;

    var PHOTO_MAP = {
      PERTH: "images/perthrockstar.jpg",
      SANTA: "images/santadancer.jpg",
      DOMIIA: "images/domiia.jpg"
    };

    fetch("data.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (json) {
        introData = json.introduce || introData;
        renderProfiles();
        document.getElementById("inf-job-link").href =
          introData.infJobUrl || introData["information job"] || "#";
      })
      .catch(function () {
        document.getElementById("profile-list").innerHTML =
          "<p class='text-red-500'>Error loading data.json</p>";
      });

    function photoSrc(p) {
      if (p && PHOTO_MAP[p.id]) return PHOTO_MAP[p.id];
      var src = (p && p.photo) || p || "";
      if (!src) return "";
      if (src.indexOf("http") === 0 || src.indexOf("images/") === 0) return src;
      return "images/" + src;
    }

    function socialLinks(p) {
      var icons = {
        X: {
          svg: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2H21.5l-7.5 8.57L22.5 22h-6.56l-5.14-6.72L5.2 22H1.94l8.02-9.16L1.5 2h6.73l4.65 6.17L18.244 2zm-1.15 18.12h1.82L7 3.78H5.05l12.04 16.34z"/></svg>',
          cls: "bg-black hover:bg-zinc-800 text-white border border-zinc-700"
        },
        IG: {
          svg: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
          cls: "text-white"
        },
        Instagram: {
          svg: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
          cls: "text-white"
        },
        TikTok: {
          svg: '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 3c.2 2.6 1.6 4.4 4.2 4.7v2.6c-1.4 0-2.7-.4-4.1-1.3v6.7c0 3.4-2.6 6.1-6.1 6.1S2.4 19.1 2.4 15.6 5 9.5 8.5 9.5c.4 0 .8 0 1.1.1v2.8c-.3-.1-.7-.2-1.1-.2-2 0-3.6 1.6-3.6 3.6s1.6 3.6 3.6 3.6 3.6-1.6 3.6-3.6V3h2.4z"/></svg>',
          cls: "bg-black hover:bg-zinc-800 text-white border border-zinc-700"
        }
      };

      return (p.socials || []).filter(function (s) { return s.url; }).map(function (s) {
        var item = icons[s.name] || { svg: s.name, cls: "bg-zinc-800 text-white border border-zinc-700" };
        var extra = "";
        if (s.name === "IG" || s.name === "Instagram") {
          extra = ' style="background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4)"';
        } else if (s.name === "TikTok") {
          extra = ' style="box-shadow: 2px 0 0 #25F4EE, -2px 0 0 #FE2C55"';
        }
        return '<a href="' + s.url + '" target="_blank" rel="noopener" title="' + s.name + '" class="inline-flex items-center justify-center w-11 h-11 rounded-full ' + item.cls + '"' + extra + ">" + item.svg + "</a>";
      }).join("") || '<span class="text-sm text-gray-500">No links yet</span>';
    }

    function hideAll() {
      document.getElementById("intro-home").classList.add("hidden");
      document.getElementById("intro-detail").classList.add("hidden");
      document.getElementById("intro-schedule").classList.add("hidden");
    }

    function renderProfiles() {
      var box = document.getElementById("profile-list");
      box.innerHTML = "";
      (introData.profiles || []).forEach(function (p, i) {
        var el = document.createElement("button");
        el.type = "button";
        el.className = "profile-card";
        el.onclick = function () { showProfile(i); };
        el.innerHTML =
          '<div class="photo-frame"><img src="' + photoSrc(p) + '" alt="' + (p.name || "") + '"></div>' +
          '<div class="p-4">' +
            '<h3 class="text-lg sm:text-xl font-bold text-zinc-100">' + (p.name || "") + "</h3>" +
            '<p class="text-sm text-gray-400 truncate mt-0.5">' + (p.fullname || "") + "</p>" +
          "</div>";
        box.appendChild(el);
      });
    }

    function showProfile(i) {
      var list = introData.profiles || [];
      if (!list[i]) return;
      currentIndex = i;
      var p = list[i];
      hideAll();
      document.getElementById("intro-detail").classList.remove("hidden");
      document.getElementById("detail-name").innerText = p.name || "Profile";
      document.getElementById("next-btn").classList.toggle("hidden", i >= list.length - 1);
      document.getElementById("detail-box").innerHTML =
        '<div class="photo-frame-lg"><img src="' + photoSrc(p) + '" alt=""></div>' +
        '<p class="text-sm text-gray-400 mb-1 mt-6">Full name</p>' +
        '<p class="text-lg font-semibold mb-4 text-zinc-100">' + (p.fullname || p.name || "—") + "</p>" +
        '<p class="text-sm text-gray-400 mb-1">Thai name</p>' +
        '<p class="text-lg font-semibold mb-4 text-zinc-100">' + (p.thaiName || "—") + "</p>" +
        '<p class="text-sm text-gray-400 mb-1">Role</p>' +
        '<p class="text-lg font-semibold mb-4 text-zinc-100">' + (p.role || "—") + "</p>" +
        '<p class="text-sm text-gray-400 mb-1">Birthday</p>' +
        '<p class="text-lg font-semibold mb-4 text-zinc-100">' + (p.born || "—") + "</p>" +
        '<p class="text-sm text-gray-400 mb-1">Agency</p>' +
        '<p class="text-lg font-semibold mb-5 text-zinc-100">' + (p.agency || "—") + "</p>" +
        '<p class="text-sm text-gray-400 mb-2">Socials</p>' +
        '<div class="flex flex-wrap gap-3">' + socialLinks(p) + "</div>";
    }

    function prevProfile() {
      if (currentIndex > 0) showProfile(currentIndex - 1);
      else backToHome();
    }

    function nextProfile() {
      if (currentIndex < (introData.profiles || []).length - 1) {
        showProfile(currentIndex + 1);
      }
    }

    function tagText(v) {
      if (!v) return "";
      return String(v).charAt(0) === "#" ? v : "#" + v;
    }

    function copyText(text, btn) {
      if (!text) return;
      function done() {
        var old = btn.innerHTML;
        btn.classList.add("copied");
        btn.innerHTML = "✓ Copied";
        setTimeout(function () {
          btn.classList.remove("copied");
          btn.innerHTML = old;
        }, 1500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {
          fallbackCopy(text);
          done();
        });
      } else {
        fallbackCopy(text);
        done();
      }
    }

    function fallbackCopy(text) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }

    function showSchedule() {
      hideAll();
      document.getElementById("intro-schedule").classList.remove("hidden");
      var box = document.getElementById("schedule-box");
      box.innerHTML = "";

      var now = new Date();
      var today = new Date(now);
      today.setHours(0, 0, 0, 0);

      function parseEventDate(dateStr, monthStr) {
        try {
          var yearMatch = (monthStr || "").match(/\d{4}/);
          var year = yearMatch ? yearMatch[0] : now.getFullYear();
          var d = new Date(dateStr + " " + year);
          if (isNaN(d.getTime())) return null;
          d.setHours(0, 0, 0, 0);
          return d;
        } catch (e) { return null; }
      }

      function parseEventTime(note) {
        if (!note) return null;
        var m = String(note).match(/(\d{1,2}):(\d{2})/);
        if (!m) return null;
        return { h: parseInt(m[1], 10), min: parseInt(m[2], 10) };
      }

      var forLabels = {
        PERTH: "Perth",
        SANTA: "Santa",
        DOMIIA: "Domiia",
        PS: "PS",
        PSD: "PSD"
      };

      (introData.schedule || []).forEach(function (m) {
        var itemsHtml = (m.items || []).map(function (it) {
          var hash = it.hashtag || it.hastag || "";
          var keyw = it.keyword || "";
          var loc = it.location || "";
          var dateStr = it.date || "";

          var eventDate = parseEventDate(dateStr, m.month);
          var isPast = false;
          var isToday = false;

          if (eventDate) {
            if (eventDate.getTime() < today.getTime()) {
              isPast = true;
            } else if (eventDate.getTime() === today.getTime()) {
              isToday = true;
              var t = parseEventTime(it.note);
              if (t) {
                var endApprox = new Date(eventDate);
                endApprox.setHours(t.h + 2, t.min, 0, 0);
                if (now > endApprox) {
                  isPast = true;
                  isToday = false;
                }
              }
            }
          }

          // Who's job
          var forRaw = it.for || it.who || [];
          if (typeof forRaw === "string") forRaw = [forRaw];
          var forHtml = forRaw.length
            ? '<div class="flex flex-wrap gap-1 mb-1.5">' +
              forRaw.map(function (f) {
                var label = forLabels[String(f).toUpperCase()] || f;
                return '<span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-red-900/60 border border-red-700/50 text-red-200">' + label + "</span>";
              }).join("") +
              "</div>"
            : "";

          var extra = "";
          if (loc)  extra += '<p class="text-[11px] text-gray-400 mt-1.5 leading-snug break-all">📍 ' + loc + "</p>";
          if (keyw) extra += '<p class="text-[11px] text-gray-300 mt-1 leading-snug break-all">🔑 ' + keyw + "</p>";
          if (hash) extra += '<p class="text-[11px] text-red-400 mt-0.5 leading-snug break-all">' + tagText(hash) + "</p>";

          var copyParts = [];
          if (keyw) copyParts.push(keyw);
          if (hash) copyParts.push(tagText(hash));
          var copyPayload = copyParts.join("\n\n");
          var copyBtn = copyPayload
            ? '<button type="button" class="copy-btn !mt-2 !text-[10px] !py-1 !px-2" data-copy="' +
              copyPayload.replace(/"/g, "&quot;") + '">📋 Copy</button>'
            : "";

          var badge = "";
          if (isToday) {
            badge = '<span class="absolute top-2 right-2 text-[10px] font-bold px-1.5 py-0.5 rounded bg-red-600 text-white shadow">TODAY</span>';
          } else if (isPast) {
            badge = '<span class="absolute top-2 right-2 w-5 h-5 rounded-full bg-zinc-600 flex items-center justify-center text-white text-xs">✓</span>';
          }

          var cardClass = "relative rounded-xl p-3 border ";
          var styleExtra = "";

          if (isToday) {
            cardClass += "bg-gradient-to-br from-[#2a0a0a] to-[#0a0a0a] border-red-500 ring-1 ring-red-500/40";
            styleExtra = ' style="box-shadow:0 0 16px rgba(239,68,68,0.35);"';
          } else if (isPast) {
            cardClass += "bg-zinc-900/50 border-zinc-700/50 opacity-55";
          } else {
            cardClass += "bg-gradient-to-br from-[#2a0a0a] to-[#0a0a0a] border-red-900/50";
          }

          return (
            '<div class="' + cardClass + '"' + styleExtra + ">" +
              badge +
              '<p class="text-red-400 text-xs font-semibold mb-1">' + dateStr + "</p>" +
              forHtml +
              '<p class="text-sm font-medium text-zinc-100 leading-snug pr-7">' + (it.title || "") + "</p>" +
              '<p class="text-[11px] text-gray-400 mt-0.5">' + (it.note || "") + "</p>" +
              extra +
              copyBtn +
            "</div>"
          );
        }).join("");

        var el = document.createElement("div");
        el.className = "mb-6";
        el.innerHTML =
          '<h3 class="text-lg sm:text-xl font-bold text-zinc-100 mb-3">' + (m.month || "") + "</h3>" +
          '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">' +
            itemsHtml +
          "</div>";
        box.appendChild(el);
      });

      box.querySelectorAll(".copy-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          copyText(btn.getAttribute("data-copy") || "", btn);
        });
      });
    }

    function backToHome() {
      hideAll();
      document.getElementById("intro-home").classList.remove("hidden");
    }
  </script>
</body>
</html>
