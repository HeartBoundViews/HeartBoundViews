<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heartbound Series Trends - PerthSanta Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background: #070707; min-height: 100vh; }
    body { font-family: Inter, system-ui, sans-serif; color: #fff; }

    .title-serif { font-family: "Cormorant Garamond", Georgia, serif; }
       .script-font {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    /* subtle fade-in */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.5s ease both; }
    .fade-up-d1 { animation-delay: 0.08s; }
    .fade-up-d2 { animation-delay: 0.16s; }
    .fade-up-d3 { animation-delay: 0.24s; }

   /* EP buttons */
    .ep-btn {
      width: 3.25rem; height: 3.25rem;
      border-radius: 0.75rem;
      border: 1px solid #3f3f46;
      background: linear-gradient(145deg, #2a0a0a 0%, #18181b 50%, #0c0c0c 100%);
      color: #d4d4d8;
      font-size: 0.8rem; font-weight: 600;
      transition: all 0.25s ease;
      display: flex; align-items: center; justify-content: center;
    }
    @media (min-width: 640px) {
      .ep-btn { width: 3.75rem; height: 3.75rem; font-size: 0.875rem; }
    }
    .ep-btn:hover {
      border-color: #ef4444;
      color: #fff;
      background: linear-gradient(145deg, #450a0a 0%, #1c0909 50%, #0c0c0c 100%);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.3);
    }
    .ep-btn.active {
      border-color: #ef4444;
      color: #fff;
      background: linear-gradient(145deg, #7f1d1d 0%, #1c0909 55%, #0a0a0a 100%);
      box-shadow: 0 0 0 1px #ef4444, 0 0 18px rgba(239, 68, 68, 0.4);
    }
    /* Generator cards */
    .gen-card {
      aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 0.75rem;
      text-align: center;
      padding: 0.5rem;
      transition: all 0.25s ease;
    }
    .gen-card:hover {
      border-color: #ef4444;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(185, 28, 28, 0.2);
    }

    /* Guide platform cards */
    .guide-card {
      background: linear-gradient(165deg, #2a0a0a 0%, #141414 45%, #0a0a0a 100%);
      border: 1px solid #3f1a1a;
      border-radius: 1rem;
      padding: 1.25rem 0.75rem;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .guide-card::after {
      content: "";
      position: absolute; left: 20%; right: 20%; bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ef4444, transparent);
      opacity: 0.7;
      transition: opacity 0.3s;
    }
    .guide-card:hover {
      border-color: #991b1b;
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(185, 28, 28, 0.22);
      background: linear-gradient(165deg, #450a0a 0%, #1a0a0a 45%, #0a0a0a 100%);
    }
    .guide-card:hover::after { opacity: 1; }
    /* soft red glow corners */
    .page-glow {
      pointer-events: none;
      position: fixed;
      width: 280px; height: 280px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      z-index: 0;
    }
  </style>
</head>
<body class="text-white relative overflow-x-hidden">

  <!-- soft background glows -->
  <div class="page-glow bg-red-600" style="top:-80px;right:-60px;"></div>
  <div class="page-glow bg-red-800" style="bottom:10%;left:-80px;"></div>

  <div class="relative z-10 max-w-4xl mx-auto px-4 pt-8 pb-6">
    <div class="flex items-start justify-between gap-4">
      <div class="fade-up">
        <h1 class="title-serif text-4xl sm:text-5xl md:text-6xl font-bold leading-none tracking-tight">
          <span class="text-white">Heartbound Series</span><br>
          <span class="text-red-500">Trends</span>
        </h1>
        <p class="text-gray-400 text-sm mt-3">Select an episode to view generators</p>
      </div>
            <div class="hidden sm:block text-right fade-up fade-up-d1 pt-2">
        <p class="script-font text-base md:text-lg text-white/70 tracking-wide font-light whitespace-nowrap">
          Together We Make It Happen
        </p>
        <div class="ml-auto mt-1.5 w-20 h-px bg-red-500/60 rounded-full"></div>
      </div>
    </div>
  </div>

  <!-- EP buttons -->
  <div id="episode-list" class="relative z-10 max-w-4xl mx-auto px-4 flex flex-wrap gap-2 sm:gap-2.5 mb-8 fade-up fade-up-d2"></div>

  <!-- Generators -->
  <div id="generators-section" class="hidden relative z-10 max-w-4xl mx-auto px-4 pb-8">
    <div class="flex items-center justify-between mb-5 gap-3">
      <h2 class="text-xl sm:text-2xl font-bold">
        Episode <span id="current-ep" class="text-red-500">1</span>
        <span class="text-gray-500 font-normal text-base">– Generators</span>
      </h2>
      <button type="button" onclick="backToEpisodes()"
        class="text-sm text-red-400 hover:text-red-300 transition">← Back</button>
    </div>
    <div id="generators-list" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2"></div>
  </div>

  <!-- divider -->
  <div class="relative z-10 max-w-4xl mx-auto px-4 mb-8">
    <div class="h-px bg-gradient-to-r from-transparent via-red-800/50 to-transparent"></div>
  </div>

  <!-- Guide Trending -->
  <section class="relative z-10 max-w-4xl mx-auto px-4 pb-24 fade-up fade-up-d3">
    <div class="flex items-center gap-2.5 mb-1">
      <span class="w-1 h-5 bg-red-500 rounded-full"></span>
      <h2 class="text-xl font-bold text-red-500">Guide Trending</h2>
    </div>
    <p class="text-gray-400 text-sm mb-5 ml-3.5">How to trend Heartbound on each platform.</p>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
      <a href="guide-x.html" class="guide-card block">
        <div class="icon-box">
          <img src="https://cdn.simpleicons.org/x/ffffff" alt="X" class="w-6 h-6">
        </div>
        <p class="text-xs font-semibold tracking-wider text-zinc-300">X</p>
      </a>
      <a href="guide-instagram.html" class="guide-card block">
        <div class="icon-box">
          <img src="https://cdn.simpleicons.org/instagram/E4405F" alt="Instagram" class="w-6 h-6">
        </div>
        <p class="text-xs font-semibold tracking-wider text-zinc-300">INSTAGRAM</p>
      </a>
      <a href="guide-tiktok.html" class="guide-card block">
        <div class="icon-box">
          <img src="https://cdn.simpleicons.org/tiktok/ffffff" alt="TikTok" class="w-6 h-6">
        </div>
        <p class="text-xs font-semibold tracking-wider text-zinc-300">TIKTOK</p>
      </a>
      <a href="guide-facebook.html" class="guide-card block">
        <div class="icon-box">
          <img src="https://cdn.simpleicons.org/facebook/1877F2" alt="Facebook" class="w-6 h-6">
        </div>
        <p class="text-xs font-semibold tracking-wider text-zinc-300">FACEBOOK</p>
      </a>
      <a href="guide-youtube.html" class="guide-card block">
        <div class="icon-box">
          <img src="https://cdn.simpleicons.org/youtube/FF0000" alt="YouTube" class="w-6 h-6">
        </div>
        <p class="text-xs font-semibold tracking-wider text-zinc-300">YOUTUBE</p>
      </a>
    </div>
  </section>

  <script src="common.js"></script>
  <script>
    let data = {};
    const TOTAL_EPS = 10;
    const TOTAL_GENS = 10;
    let activeEp = null;

    fetch("data.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (json) { data = json || {}; renderEpisodes(); })
      .catch(function () { data = { episodes: {} }; renderEpisodes(); });

    function renderEpisodes() {
      var container = document.getElementById("episode-list");
      container.innerHTML = "";
      for (var i = 1; i <= TOTAL_EPS; i++) {
        var ep = String(i);
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ep-btn";
        btn.textContent = "EP " + ep;
        btn.dataset.ep = ep;
        btn.onclick = (function (n) {
          return function () { showGenerators(n); };
        })(ep);
        container.appendChild(btn);
      }
    }

    function setActiveEp(epNumber) {
      activeEp = epNumber;
      var buttons = document.querySelectorAll(".ep-btn");
      buttons.forEach(function (b) {
        if (b.dataset.ep === String(epNumber)) b.classList.add("active");
        else b.classList.remove("active");
      });
    }

    function showGenerators(epNumber) {
      setActiveEp(epNumber);
      document.getElementById("generators-section").classList.remove("hidden");
      document.getElementById("current-ep").innerText = epNumber;

      var container = document.getElementById("generators-list");
      container.innerHTML = "";
      var list = (data.episodes && data.episodes[epNumber]) || [];

      for (var i = 1; i <= TOTAL_GENS; i++) {
        var gen = list[i - 1] || {};
        var name = gen.name || ("Generator " + i);
        var url = gen.url || "#";

        var a = document.createElement("a");
        a.href = url;
        if (url && url !== "#") {
          a.target = "_blank";
          a.rel = "noopener";
        }
        a.className = "gen-card";
        a.innerHTML = '<p class="font-medium text-xs sm:text-sm text-white">' + name + "</p>";
        container.appendChild(a);
      }

      // smooth scroll to generators
      document.getElementById("generators-section").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function backToEpisodes() {
      document.getElementById("generators-section").classList.add("hidden");
      activeEp = null;
      document.querySelectorAll(".ep-btn").forEach(function (b) { b.classList.remove("active"); });
    }
  </script>
</body>
</html>
