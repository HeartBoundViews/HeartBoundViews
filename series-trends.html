<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heartbound Series Trends - PerthSanta Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #070707; min-height: 100vh; }
    .card { transition: all 0.25s ease; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(185, 28, 28, 0.25); }
  </style>
</head>
<body class="text-white">
  <div class="max-w-4xl mx-auto px-4 pt-8 pb-6">
    <h1 class="text-3xl md:text-4xl font-bold mb-2">Heartbound Series Trends</h1>
    <p class="text-gray-400">Select an episode to view generators</p>
  </div>

   <div id="episode-list" class="max-w-4xl mx-auto px-4 flex flex-wrap gap-2 mb-10"></div>

  <div id="generators-section" class="hidden max-w-4xl mx-auto px-4 pb-10">
    <div class="flex items-center justify-between mb-6 gap-3">
      <h2 class="text-2xl font-bold">Episode <span id="current-ep">1</span> – Generators</h2>
      <button type="button" onclick="backToEpisodes()" class="text-sm text-red-500 hover:text-red-400">← Back to Episodes</button>
    </div>
    <div id="generators-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3"></div>
  </div>

  <section class="max-w-4xl mx-auto px-4 pb-20">
    <h2 class="text-xl font-bold mb-1">Guide Trending</h2>
    <p class="text-gray-400 text-sm mb-4">How to trend Heartbound on each platform.</p>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
      <a href="guide-x.html" class="card bg-zinc-900 border border-zinc-700 rounded-2xl p-5 text-center min-h-[140px] block">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800 flex items-center justify-center">
          <img src="https://cdn.simpleicons.org/x/ffffff" alt="X" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">X</p>
      </a>
      <a href="guide-instagram.html" class="card bg-zinc-900 border border-zinc-700 rounded-2xl p-5 text-center min-h-[140px] block">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800 flex items-center justify-center">
          <img src="https://cdn.simpleicons.org/instagram/E4405F" alt="Instagram" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">Instagram</p>
      </a>
      <a href="guide-tiktok.html" class="card bg-zinc-900 border border-zinc-700 rounded-2xl p-5 text-center min-h-[140px] block">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800 flex items-center justify-center">
          <img src="https://cdn.simpleicons.org/tiktok/ffffff" alt="TikTok" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">TikTok</p>
      </a>
      <a href="guide-facebook.html" class="card bg-zinc-900 border border-zinc-700 rounded-2xl p-5 text-center min-h-[140px] block">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800 flex items-center justify-center">
          <img src="https://cdn.simpleicons.org/facebook/1877F2" alt="Facebook" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">Facebook</p>
      </a>
      <a href="guide-youtube.html" class="card bg-zinc-900 border border-zinc-700 rounded-2xl p-5 text-center min-h-[140px] block">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800 flex items-center justify-center">
          <img src="https://cdn.simpleicons.org/youtube/FF0000" alt="YouTube" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">YouTube</p>
      </a>
    </div>
  </section>

   <script src="common.js"></script>
  <script>
    let data = {};
    const TOTAL_EPS = 10;
    const TOTAL_GENS = 10;

    fetch("data.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (json) { data = json || {}; renderEpisodes(); })
      .catch(function () { data = { episodes: {} }; renderEpisodes(); });

    function renderEpisodes() {
      var container = document.getElementById("episode-list");
      container.innerHTML = "";
      for (var i = 1; i <= TOTAL_EPS; i++) {
        var ep = String(i);
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "px-4 py-2 rounded-full text-sm font-medium border border-zinc-700 bg-zinc-900 text-zinc-300 hover:border-red-500 hover:text-white transition";
        btn.textContent = "EP " + ep;
        btn.onclick = (function (n) {
          return function () { showGenerators(n); };
        })(ep);
        container.appendChild(btn);
      }
    }

    function showGenerators(epNumber) {
      document.getElementById("episode-list").classList.add("hidden");
      document.getElementById("generators-section").classList.remove("hidden");
      document.getElementById("current-ep").innerText = epNumber;

      var container = document.getElementById("generators-list");
      container.innerHTML = "";
      var list = (data.episodes && data.episodes[epNumber]) || [];

      for (var i = 1; i <= TOTAL_GENS; i++) {
        var gen = list[i - 1] || {};
        var name = gen.name || ("Generator " + i);
        var url = gen.url || "#";

        var a = document.createElement("a");
        a.href = url;
        if (url && url !== "#") {
          a.target = "_blank";
          a.rel = "noopener";
        }
        a.className = "card aspect-square flex items-center justify-center bg-zinc-900 border border-zinc-700 rounded-xl hover:border-red-500 transition text-center p-3";
        a.innerHTML = '<p class="font-semibold text-sm sm:text-base text-white">' + name + "</p>";
        container.appendChild(a);
      }
    }

    function backToEpisodes() {
      document.getElementById("generators-section").classList.add("hidden");
      document.getElementById("episode-list").classList.remove("hidden");
    }
  </script>
</body>
</html>
