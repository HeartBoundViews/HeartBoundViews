<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heartbound Series Trends - PerthSanta Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      min-height: 100vh;
      background: #070707;
      position: relative;
    }
    /* Ảnh nền mờ */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url("images/poster-heartbound.jpg") center center / cover no-repeat;
      filter: blur(14px) brightness(0.35);
      transform: scale(1.1); /* tránh mép trắng khi blur */
    }
    /* Lớp phủ tối nhẹ để chữ dễ đọc */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(0, 0, 0, 0.45);
    }
    .card { transition: all 0.25s ease; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(185, 28, 28, 0.25); }
  </style>
</head>
<body class="text-white">
  <div class="max-w-4xl mx-auto px-4 pt-8 pb-6">
    <h1 class="text-3xl md:text-4xl font-bold mb-2">Heartbound Series Trends</h1>
    <p class="text-gray-400">Select an episode to view generators</p>
  </div>

  <div id="episode-list" class="max-w-4xl mx-auto px-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 mb-10">
    <button type="button" onclick="showGenerators('1')" class="card bg-zinc-900/90 border border-zinc-700 rounded-xl p-5 text-center hover:border-red-500 min-h-[88px]">
      <p class="text-red-500 text-sm mb-1">EP</p>
      <p class="text-2xl font-bold">1</p>
    </button>
  </div>

  <div id="generators-section" class="hidden max-w-4xl mx-auto px-4 pb-10">
    <div class="flex items-center justify-between mb-6 gap-3">
      <h2 class="text-2xl font-bold">Episode <span id="current-ep">1</span> – Generators</h2>
      <button type="button" onclick="backToEpisodes()" class="text-sm text-red-500 hover:text-red-400">← Back to Episodes</button>
    </div>
    <div id="generators-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
  </div>

  <section class="max-w-4xl mx-auto px-4 pb-20">
    <h2 class="text-xl font-bold mb-1">Guide Trending</h2>
    <p class="text-gray-400 text-sm mb-4">How to trend Heartbound on each platform.</p>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
      <a href="guide-x.html" class="card bg-zinc-900/90 border border-zinc-700 rounded-2xl p-5 text-center min-h-[140px] block">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800 flex items-center justify-center">
          <img src="https://cdn.simpleicons.org/x/ffffff" alt="X" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">X</p>
      </a>
      <a href="guide-instagram.html" class="card bg-zinc-900/90 border border-zinc-700 rounded-2xl p-5 text-center min-h-[140px] block">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800 flex items-center justify-center">
          <img src="https://cdn.simpleicons.org/instagram/E4405F" alt="Instagram" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">Instagram</p>
      </a>
      <a href="guide-tiktok.html" class="card bg-zinc-900/90 border border-zinc-700 rounded-2xl p-5 text-center min-h-[140px] block">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800 flex items-center justify-center">
          <img src="https://cdn.simpleicons.org/tiktok/ffffff" alt="TikTok" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">TikTok</p>
      </a>
      <a href="guide-facebook.html" class="card bg-zinc-900/90 border border-zinc-700 rounded-2xl p-5 text-center min-h-[140px] block">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800 flex items-center justify-center">
          <img src="https://cdn.simpleicons.org/facebook/1877F2" alt="Facebook" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">Facebook</p>
      </a>
      <a href="guide-youtube.html" class="card bg-zinc-900/90 border border-zinc-700 rounded-2xl p-5 text-center min-h-[140px] block">
        <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800 flex items-center justify-center">
          <img src="https://cdn.simpleicons.org/youtube/FF0000" alt="YouTube" class="w-7 h-7">
        </div>
        <p class="text-lg font-bold">YouTube</p>
      </a>
    </div>
  </section>

  <script src="common.js"></script>
  <script>
    let data = {};

    fetch("data.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (json) { data = json || {}; renderEpisodes(); })
      .catch(function () { data = { episodes: { "1": [] } }; renderEpisodes(); });

    function renderEpisodes() {
      var container = document.getElementById("episode-list");
      var eps = Object.keys((data && data.episodes) || {});
      if (!eps.length) eps = ["1"];
      eps.sort(function (a, b) { return a - b; });
      container.innerHTML = "";
      eps.forEach(function (ep) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "card bg-zinc-900/90 border border-zinc-700 rounded-xl p-5 text-center hover:border-red-500 min-h-[88px]";
        btn.innerHTML = '<p class="text-red-500 text-sm mb-1">EP</p><p class="text-2xl font-bold">' + ep + "</p>";
        btn.onclick = function () { showGenerators(ep); };
        container.appendChild(btn);
      });
    }

    function showGenerators(epNumber) {
      document.getElementById("episode-list").classList.add("hidden");
      document.getElementById("generators-section").classList.remove("hidden");
      document.getElementById("current-ep").innerText = epNumber;
      var container = document.getElementById("generators-list");
      container.innerHTML = "";
      var list = (data.episodes && data.episodes[epNumber]) || [];
      if (!list.length) {
        container.innerHTML = '<p class="text-gray-400">No generators yet.</p>';
        return;
      }
      list.forEach(function (gen) {
        var a = document.createElement("a");
        a.href = gen.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.className = "card bg-zinc-900/90 border border-zinc-700 rounded-xl p-5 hover:border-red-500 block";
        a.innerHTML = '<p class="text-red-500 text-sm mb-1">' + gen.name + '</p><p class="font-medium">' + gen.title + '</p><p class="text-xs text-gray-500 mt-2">Click to open →</p>';
        container.appendChild(a);
      });
    }

    function backToEpisodes() {
      document.getElementById("generators-section").classList.add("hidden");
      document.getElementById("episode-list").classList.remove("hidden");
    }
  </script>
</body>
</html>
