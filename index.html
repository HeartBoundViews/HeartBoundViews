<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PerthSanta Engagement Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      background: #070707 !important;
      min-height: 100vh;
    }
    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 35%;
      display: block;
    }
    .hero-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      text-shadow: 0 2px 16px rgba(0,0,0,.75), 0 1px 3px rgba(0,0,0,.9);
    }
    .hero-sub {
      font-family: "Outfit", system-ui, sans-serif;
      letter-spacing: 0.22em;
      text-shadow: 0 2px 12px rgba(0,0,0,.7);
    }

    /* 4 ô nhiệm vụ — style series-trends */
    .menu-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: linear-gradient(165deg, #2a0a0a 0%, #141414 45%, #0a0a0a 100%);
      border: 1px solid #3f1a1a;
      border-radius: 1rem;
      padding: 0.9rem 1rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .menu-row::after {
      content: "";
      position: absolute;
      left: 20%; right: 20%; bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ef4444, transparent);
      opacity: 0.6;
    }
    .menu-row:hover {
      border-color: #991b1b;
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(185, 28, 28, 0.22);
      background: linear-gradient(165deg, #450a0a 0%, #1a0a0a 45%, #0a0a0a 100%);
    }
    .menu-row:hover::after { opacity: 1; }
    .menu-row:active {
      transform: translateY(-1px);
    }
    .menu-icon {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 0.75rem;
      background: #0a0a0a;
      border: 1px solid #3f1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #f87171;
    }
    @media (min-width: 640px) {
      .menu-row { padding: 1.1rem 1.25rem; }
      .menu-icon { width: 3rem; height: 3rem; }
    }
  </style>
</head>
<body class="text-white bg-[#070707]">

  <main class="max-w-6xl mx-auto px-4 pt-3 sm:pt-4 pb-6">

    <!-- HERO -->
    <div class="relative overflow-hidden rounded-2xl sm:rounded-3xl border border-red-900/30 bg-black mb-3 sm:mb-4 h-[200px] sm:h-[300px] md:h-[380px]">
      <img src="images/hero-perthsanta.jpg" alt="PerthSanta" class="hero-img absolute inset-0">
      <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-black/5 to-black/20"></div>

      <!-- Title: kéo lên cao, tránh che mặt -->
      <div class="absolute inset-x-0 top-0 flex flex-col items-center text-center px-4 pt-4 sm:pt-6 md:pt-8">
        <h1 data-i18n="title" class="hero-title text-2xl sm:text-4xl md:text-5xl font-bold tracking-wide text-white">
          PerthSanta × Domiia
        </h1>
        <p data-i18n="subtitle" class="hero-sub mt-1 sm:mt-2 text-[10px] sm:text-xs md:text-sm uppercase text-white/90 font-medium">
          Together Forever
        </p>
      </div>

      <!-- Credit tác giả ảnh -->
      <a href="https://x.com/jammyjellyjam?s=20"
         target="_blank"
         rel="noopener noreferrer"
         class="absolute bottom-2 right-3 sm:bottom-3 sm:right-4 text-[10px] sm:text-xs text-white/70 hover:text-white transition">
        @jammyjellyjam
      </a>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">

      <a href="series-trends.html" class="menu-row">
        <div class="menu-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </div>
        <div class="min-w-0 flex-1">
          <p data-i18n="card1Title" class="font-semibold text-white text-[15px] sm:text-base truncate">Heartbound Series Trends</p>
          <p data-i18n="card1Desc" class="text-xs sm:text-sm text-zinc-400 mt-0.5 truncate">See what fans are loving</p>
        </div>
        <span class="text-red-500 text-xl shrink-0">›</span>
      </a>

      <a href="daily-missions.html" class="menu-row">
        <div class="menu-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
        </div>
        <div class="min-w-0 flex-1">
          <p data-i18n="card2Title" class="font-semibold text-white text-[15px] sm:text-base truncate">Daily Missions</p>
          <p data-i18n="card2Desc" class="text-xs sm:text-sm text-zinc-400 mt-0.5 truncate">Complete tasks, earn rewards</p>
        </div>
        <span class="text-red-500 text-xl shrink-0">›</span>
      </a>

      <a href="youtube-streaming.html" class="menu-row">
        <div class="menu-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.8 15.5v-7l6.2 3.5-6.2 3.5z"/></svg>
        </div>
        <div class="min-w-0 flex-1">
          <p data-i18n="card3Title" class="font-semibold text-white text-[15px] sm:text-base truncate">YouTube Streaming</p>
          <p data-i18n="card3Desc" class="text-xs sm:text-sm text-zinc-400 mt-0.5 truncate">Live streams & exclusive content</p>
        </div>
        <span class="text-red-500 text-xl shrink-0">›</span>
      </a>

      <a href="ig-engagement.html" class="menu-row">
        <div class="menu-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        </div>
        <div class="min-w-0 flex-1">
          <p data-i18n="card4Title" class="font-semibold text-white text-[15px] sm:text-base truncate">Instagram Engagement</p>
          <p data-i18n="card4Desc" class="text-xs sm:text-sm text-zinc-400 mt-0.5 truncate">Likes, comments & community</p>
        </div>
        <span class="text-red-500 text-xl shrink-0">›</span>
      </a>

    </div>
  </main>

  <script src="common.js"></script>
</body>
</html>
